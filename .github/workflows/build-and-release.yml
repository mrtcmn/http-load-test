name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  BINARY_NAME: http-load-test
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Go dependencies
        run: go mod download

      - name: Run Go tests
        run: make test

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Node.js tests
        run: npm test

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            extension: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          BINARY_PATH="bin/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.extension }}"
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "$BINARY_PATH" ./cmd/http-load-test
          
          # Generate checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BINARY_PATH" > "$BINARY_PATH.sha256"
          else
            shasum -a 256 "$BINARY_PATH" > "$BINARY_PATH.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            bin/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.extension }}
            bin/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.extension }}.sha256

  build-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies and build web
        run: |
          cd web
          npm ci
          npm run build

      - name: Create web assets archive
        run: |
          cd web
          tar -czf ../web-assets.tar.gz dist/

      - name: Generate web assets checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum web-assets.tar.gz > web-assets.tar.gz.sha256
          else
            shasum -a 256 web-assets.tar.gz > web-assets.tar.gz.sha256
          fi

      - name: Upload web assets
        uses: actions/upload-artifact@v3
        with:
          name: web-assets
          path: |
            web-assets.tar.gz
            web-assets.tar.gz.sha256

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Copy all binary artifacts
          find artifacts -name "${{ env.BINARY_NAME }}-*" -type f | while read file; do
            cp "$file" release-assets/
          done
          
          # Copy web assets
          cp artifacts/web-assets/web-assets.tar.gz* release-assets/

      - name: Generate release notes
        run: |
          echo "## Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Binary Downloads" >> release-notes.md
          echo "" >> release-notes.md
          echo "| Platform | Architecture | Download |" >> release-notes.md
          echo "|----------|--------------|----------|" >> release-notes.md
          echo "| Linux | x64 | [${{ env.BINARY_NAME }}-linux-amd64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BINARY_NAME }}-linux-amd64) |" >> release-notes.md
          echo "| Linux | ARM64 | [${{ env.BINARY_NAME }}-linux-arm64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BINARY_NAME }}-linux-arm64) |" >> release-notes.md
          echo "| macOS | x64 | [${{ env.BINARY_NAME }}-darwin-amd64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BINARY_NAME }}-darwin-amd64) |" >> release-notes.md
          echo "| macOS | ARM64 | [${{ env.BINARY_NAME }}-darwin-arm64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BINARY_NAME }}-darwin-arm64) |" >> release-notes.md
          echo "| Windows | x64 | [${{ env.BINARY_NAME }}-windows-amd64.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BINARY_NAME }}-windows-amd64.exe) |" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Verification" >> release-notes.md
          echo "" >> release-notes.md
          echo "All binaries include SHA256 checksums for verification:" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "# Verify binary integrity" >> release-notes.md
          echo "sha256sum -c ${{ env.BINARY_NAME }}-<platform>-<arch>.sha256" >> release-notes.md
          echo '```' >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [build, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Download web assets
        uses: actions/download-artifact@v3
        with:
          name: web-assets
          path: .

      - name: Extract web assets
        run: |
          cd web
          tar -xzf ../web-assets.tar.gz

      - name: Update package version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}