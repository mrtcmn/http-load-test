name: Test Build Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  test-build-scripts:
    name: Test Build Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Go dependencies
        run: go mod download

      - name: Test build-all script
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh test-build

      - name: Test checksum generation
        run: |
          chmod +x scripts/generate-checksums.sh
          ./scripts/generate-checksums.sh

      - name: Verify checksums
        run: |
          cd bin
          # Test verification script
          chmod +x verify.sh
          for binary in http-load-test-*; do
            if [[ ! "$binary" =~ \.(sha256|sh)$ ]]; then
              echo "Verifying $binary..."
              ./verify.sh "$binary"
            fi
          done

      - name: Test Makefile targets
        run: |
          make clean
          make build
          make test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-build-artifacts
          path: |
            bin/
            release/
          retention-days: 1

  test-cross-platform:
    name: Test Cross-Platform Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Build for current platform
        run: make build

      - name: Test binary execution
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./bin/http-load-test.exe --help || echo "Binary help test completed"
          else
            ./bin/http-load-test --help || echo "Binary help test completed"
          fi

  test-release-preparation:
    name: Test Release Preparation
    runs-on: ubuntu-latest
    needs: test-build-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          go mod download
          npm ci

      - name: Test release preparation
        run: |
          chmod +x scripts/prepare-release.sh
          ./scripts/prepare-release.sh v0.0.0-test

      - name: Verify release structure
        run: |
          echo "=== Release Directory Structure ==="
          ls -la release/
          
          echo "=== Verifying required files ==="
          test -f release/RELEASE_NOTES.md
          test -f release/install.sh
          test -f release/verify.sh
          test -f release/checksums.txt
          test -f release.tar.gz
          
          echo "=== Testing installation script ==="
          chmod +x release/install.sh
          head -20 release/install.sh
          
          echo "All release preparation tests passed!"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-release-package
          path: |
            release/
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 1